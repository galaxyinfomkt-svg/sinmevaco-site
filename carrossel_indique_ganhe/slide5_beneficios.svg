<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="50%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="white"/>

  <!-- Header -->
  <rect width="1080" height="200" fill="url(#headerGreen2)"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="28" fill="#86efac" font-weight="600">POR QUE SE FILIAR?</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">Benefícios do Filiado</text>

  <!-- Benefit 1 -->
  <rect x="60" y="240" width="960" height="150" rx="20" fill="#f0fdf4"/>
  <circle cx="150" cy="315" r="50" fill="#16a34a"/>
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">§</text>
  <text x="230" y="300" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1f2937">Assessoria Jurídica</text>
  <text x="230" y="350" font-family="Arial, sans-serif" font-size="28" fill="#6b7280">Defesa em processos éticos e trabalhistas</text>

  <!-- Benefit 2 -->
  <rect x="60" y="420" width="960" height="150" rx="20" fill="#f0fdf4"/>
  <circle cx="150" cy="495" r="50" fill="#16a34a"/>
  <text x="150" y="505" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">$</text>
  <text x="230" y="480" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1f2937">Negociação Salarial</text>
  <text x="230" y="530" font-family="Arial, sans-serif" font-size="28" fill="#6b7280">Luta por melhores salários e condições</text>

  <!-- Benefit 3 -->
  <rect x="60" y="600" width="960" height="150" rx="20" fill="#f0fdf4"/>
  <circle cx="150" cy="675" r="50" fill="#16a34a"/>
  <text x="150" y="685" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">+</text>
  <text x="230" y="660" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1f2937">Proteção Profissional</text>
  <text x="230" y="710" font-family="Arial, sans-serif" font-size="28" fill="#6b7280">Apoio em conflitos no ambiente de trabalho</text>

  <!-- Benefit 4 -->
  <rect x="60" y="780" width="960" height="150" rx="20" fill="#fef3c7"/>
  <circle cx="150" cy="855" r="50" fill="#f59e0b"/>
  <text x="150" y="865" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">%</text>
  <text x="230" y="840" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1f2937">Descontos Exclusivos</text>
  <text x="230" y="890" font-family="Arial, sans-serif" font-size="28" fill="#6b7280">Parcerias com diversas empresas</text>

  <!-- Footer -->
  <rect y="960" width="1080" height="120" fill="#f3f4f6"/>
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="32" fill="#6b7280" text-anchor="middle">Mensalidade: R$ 150,00/mes</text>
</svg>
