<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#amberBg)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="150" r="150" fill="rgba(255,255,255,0.15)"/>
  <circle cx="130" cy="900" r="120" fill="rgba(255,255,255,0.15)"/>

  <!-- Header -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="rgba(120,53,15,0.7)">O QUE VOCÊ GANHA</text>

  <!-- Main value card -->
  <rect x="140" y="180" width="800" height="380" rx="40" fill="white"/>
  <text x="540" y="290" font-family="Arial, sans-serif" font-size="32" fill="#6b7280" text-anchor="middle">Economia de até</text>
  <text x="540" y="430" font-family="Arial, sans-serif" font-size="160" font-weight="900" fill="#16a34a" text-anchor="middle">R$300</text>
  <text x="540" y="510" font-family="Arial, sans-serif" font-size="32" fill="#6b7280" text-anchor="middle">por indicação</text>

  <!-- Division cards -->
  <rect x="120" y="620" width="380" height="160" rx="25" fill="rgba(255,255,255,0.35)"/>
  <text x="310" y="700" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" text-anchor="middle">R$150</text>
  <text x="310" y="745" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)" text-anchor="middle">para você</text>

  <text x="540" y="700" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">+</text>

  <rect x="580" y="620" width="380" height="160" rx="25" fill="rgba(255,255,255,0.35)"/>
  <text x="770" y="700" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white" text-anchor="middle">R$150</text>
  <text x="770" y="745" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)" text-anchor="middle">para o colega</text>

  <!-- Footer note -->
  <text x="540" y="900" font-family="Arial, sans-serif" font-size="28" fill="rgba(120,53,15,0.6)" text-anchor="middle">Valor equivalente a 1 mes de mensalidade</text>

  <!-- Instagram handle -->
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="24" fill="rgba(120,53,15,0.5)" text-anchor="middle">@sinmevaco</text>
</svg>
