<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="50%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="white"/>

  <!-- Header -->
  <rect width="1080" height="200" fill="url(#headerGreen)"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="28" fill="#86efac" font-weight="600">PASSO A PASSO</text>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white">Como Funciona?</text>

  <!-- Step 1 -->
  <circle cx="150" cy="370" r="70" fill="#16a34a"/>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">1</text>
  <text x="280" y="355" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1f2937">Você indica</text>
  <text x="280" y="405" font-family="Arial, sans-serif" font-size="32" fill="#6b7280">um colega médico para o SINMEVAÇO</text>

  <!-- Arrow 1 -->
  <path d="M540 470 L540 520" stroke="#22c55e" stroke-width="4" fill="none"/>
  <path d="M520 500 L540 530 L560 500" stroke="#22c55e" stroke-width="4" fill="none"/>

  <!-- Step 2 -->
  <circle cx="150" cy="620" r="70" fill="#16a34a"/>
  <text x="150" y="640" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">2</text>
  <text x="280" y="605" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1f2937">Ele se filia</text>
  <text x="280" y="655" font-family="Arial, sans-serif" font-size="32" fill="#6b7280">preenchendo o formulario no site</text>

  <!-- Arrow 2 -->
  <path d="M540 720 L540 770" stroke="#22c55e" stroke-width="4" fill="none"/>
  <path d="M520 750 L540 780 L560 750" stroke="#22c55e" stroke-width="4" fill="none"/>

  <!-- Step 3 -->
  <circle cx="150" cy="870" r="70" fill="#f59e0b"/>
  <text x="150" y="890" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">3</text>
  <text x="280" y="855" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1f2937">Vocês ganham!</text>
  <text x="280" y="905" font-family="Arial, sans-serif" font-size="32" fill="#6b7280">1 mês grátis para cada um</text>

  <!-- Footer -->
  <rect y="1000" width="1080" height="80" fill="#f3f4f6"/>
  <text x="540" y="1050" font-family="Arial, sans-serif" font-size="24" fill="#6b7280" text-anchor="middle">@sinmevaco | sinmevaco-site.vercel.app</text>
</svg>
