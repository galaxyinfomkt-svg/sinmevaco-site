<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="50%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg1)"/>

  <!-- Decorative elements -->
  <circle cx="900" cy="150" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="180" cy="900" r="250" fill="rgba(255,255,255,0.03)"/>

  <!-- Alert icon -->
  <g transform="translate(440, 180)">
    <polygon points="100,0 200,180 0,180" fill="none" stroke="#ef4444" stroke-width="8"/>
    <text x="100" y="130" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ef4444" text-anchor="middle">!</text>
  </g>

  <!-- Main Title -->
  <text x="540" y="450" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="white" text-anchor="middle">VIOLÊNCIA CONTRA</text>
  <text x="540" y="530" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="white" text-anchor="middle">MÉDICOS CRESCE</text>
  <text x="540" y="630" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#fbbf24" text-anchor="middle">68%</text>

  <!-- Subtitle -->
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="32" fill="#bbf7d0" text-anchor="middle">CFM publica nova resolução para</text>
  <text x="540" y="775" font-family="Arial, sans-serif" font-size="32" fill="#bbf7d0" text-anchor="middle">proteger profissionais da saúde</text>

  <!-- Logo area -->
  <g transform="translate(440, 850)">
    <circle cx="100" cy="50" r="45" fill="none" stroke="white" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">SINMEVAÇO</text>
  </g>

  <!-- Footer -->
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.6)" text-anchor="middle">Deslize para saber mais →</text>
</svg>
